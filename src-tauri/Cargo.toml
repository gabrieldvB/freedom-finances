[package]
name = "freedom-finances-desktop"
version = "0.1.0"
description = "Aplicativo desktop local para finanças pessoais"
authors = ["Freedom Finances"]
edition = "2021"

[lib]
name = "freedom_finances_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
uuid = { version = "1", features = ["v4"] }
